name: Verify handbook
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build static pages
        run: python3 tools/build.py
      - name: Check content and data
        run: python3 -m unittest discover -s tests -v
      - name: Ensure generated files are committed
        run: git diff --exit-code -- book docs/data docs/index.html docs/examples.html docs/offline.html docs/downloads templates/30-day-plan.csv templates/metrics.csv templates/topic-library.csv templates/deals.csv
